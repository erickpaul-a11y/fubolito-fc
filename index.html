const CENTRO_Y = H / 2;

const MARGEN = 45;

let todosLosJugadores = [];

let partidoIniciado = false;

let teclas = {};

let camara = {

};


/* =========================================================

========================================================= */

const balon = {

    x: CENTRO_X,
    y: CENTRO_Y,

    vx: 0,
    vy: 0,

    radio: 11,

    poseedor: null,

    cooldown: 0

};


/* =========================================================

========================================================= */

window.addEventListener("keydown", e => {

    const tecla = e.key.toLowerCase();

    teclas[tecla] = true;

    if (

        tecla === "arrowup" ||

        tecla === "arrowleft" ||

    ) {
        e.preventDefault();
    }

});


window.addEventListener("keyup", e => {

    teclas[e.key.toLowerCase()] = false;

});


/* =========================================================

========================================================= */

const formacion433 = [

const formacion442 = [

    {

    },

/* =========================================================
   INICIAR PARTIDO
========================================================= */

function iniciarJuego() {

    const rolElegido =
        document.getElementById("posicionSelect").value;

    document.getElementById("menu").style.display = "none";

    document.getElementById("marcador").style.display = "block";

    document.getElementById("info").style.display = "block";

    canvas.style.display = "block";

    const formacion =
        Math.random() < 0.5
            ? formacion433
            : formacion442;


    let asignado = false;


    equipoLocal = formacion.map((p, i) => {

        let humano = false;

        if (!asignado && p.rol === rolElegido) {

            humano = true;

            asignado = true;

        }

        return crearJugador(
            "L" + i,
            p.rol,
            p.x,
            p.y,
            "local",
            humano
        );

    });


    if (!jugadorHumano) {

        jugadorHumano =
            equipoLocal.find(j => j.esHumano);

    }


    equipoRival = formacion.map((p, i) => {

        return crearJugador(
            "R" + i,
            p.rol,
            W - p.x,
            p.y,
            "rival",
            false
        );

    });


    todosLosJugadores = [
        ...equipoLocal,
        ...equipoRival
    ];


    partidoIniciado = true;

    reiniciarPartido();

    requestAnimationFrame(bucleJuego);

}


/* =========================================================
   CREAR JUGADOR
========================================================= */

function crearJugador(
    id,
    rol,
    x,
    y,
    equipo,
    humano
) {

    return {

        id,

        rol,

        equipo,

        x,
        y,

        baseX: x,
        baseY: y,

        esHumano: humano,

        radio: 20,

        color:
            humano
                ? "#ff3333"
                : equipo === "local"
                    ? "#c71919"
                    : "#2878e8",

        velocidad:
            humano
                ? 5.5
                : 3.7,

        sprint: 7,

        objetivoX: x,
        objetivoY: y,

        decision: Math.random() * 100,

        tieneBalon: false,

        presionando: false,

        energia: 100,

        paseCooldown: 0,

        roboCooldown: 0,

        inteligencia:
            0.75 + Math.random() * 0.25

    };

}


/* =========================================================
   UTILIDADES
========================================================= */

function limitar(v, min, max) {

    return Math.max(
        min,
        Math.min(max, v)
    );

}


function distancia(a, b) {

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );

}


function equipoDe(jugador) {

    return jugador.equipo === "local"
        ? equipoLocal
        : equipoRival;

}


function rivalDe(jugador) {

    return jugador.equipo === "local"
        ? equipoRival
        : equipoLocal;

}


function direccionAtaque(jugador) {

    return jugador.equipo === "local"
        ? 1
        : -1;

}


/* =========================================================
   IA PRINCIPAL
========================================================= */

function actualizarIA(jugador) {

    if (jugador.esHumano) {
        return;
    }


    if (jugador.paseCooldown > 0) {
        jugador.paseCooldown--;
    }


    if (jugador.roboCooldown > 0) {
        jugador.roboCooldown--;
    }


    /*
       SI TIENE EL BALÓN
    */

    if (balon.poseedor === jugador) {

        decidirConBalon(jugador);

        return;

    }


    /*
       SI SU EQUIPO TIENE EL BALÓN
    */

    if (
        balon.poseedor &&
        balon.poseedor.equipo === jugador.equipo
    ) {

        moverseEnAtaque(jugador);

        return;

    }


    /*
       SI EL RIVAL TIENE EL BALÓN
    */

    if (
        balon.poseedor &&
        balon.poseedor.equipo !== jugador.equipo
    ) {

        defenderEnEquipo(jugador);

        return;

    }


    /*
       BALÓN SUELTO
    */

    irAlBalonSiConviene(jugador);

}


/* =========================================================
   DECISIÓN CON BALÓN
========================================================= */

function decidirConBalon(jugador) {

    const dir =
        direccionAtaque(jugador);

    const porteriaX =
        jugador.equipo === "local"
            ? W
            : 0;


    const distanciaPorteria =
        Math.abs(
            porteriaX - jugador.x
        );


    const rivales =
        rivalDe(jugador);


    const rivalesCerca =
        rivales.filter(r =>
            distancia(jugador, r) < 230
        );


    /*
       TIRO
    */

    if (
        distanciaPorteria < 350 &&
        Math.random() < 0.035
    ) {

        chutar(jugador);

        return;

    }


    /*
       SI ESTÁ MUY PRESIONADO,
       BUSCAR PASE
    */

    if (
        rivalesCerca.length >= 2
    ) {

        const compañero =
            buscarMejorPase(jugador, true);

        if (compañero) {

            pasar(
                jugador,
                compañero
            );

            return;

        }

    }


    /*
       TRIANGULACIÓN
    */

    const triangulo =
        buscarTriangulacion(jugador);


    if (
        triangulo &&
        Math.random() < 0.045
    ) {

        pasar(
            jugador,
            triangulo
        );

        return;

    }


    /*
       PASE NORMAL
    */

    if (
        jugador.decision > 70 &&
        Math.random() < 0.04
    ) {

        const compañero =
            buscarMejorPase(jugador, false);

        if (compañero) {

            pasar(
                jugador,
                compañero
            );

            return;

        }

    }


    /*
       CONDUCIR
    */

    conducirBalon(jugador);

}


/* =========================================================
   BUSCAR MEJOR PASE
========================================================= */

function buscarMejorPase(
    jugador,
    emergencia
) {

    const dir =
        direccionAtaque(jugador);


    const compañeros =
        equipoDe(jugador)
            .filter(j =>
                j !== jugador &&
                j.rol !== "POR"
            );


    let mejor = null;

    let mejorPuntuacion = -Infinity;


    compañeros.forEach(comp => {

        const d =
            distancia(
                jugador,
                comp
            );


        if (d < 100 || d > 650) {
            return;
        }


        const avance =
            (comp.x - jugador.x) * dir;


        const espacio =
            espacioAlrededor(comp);


        const linea =
            lineaDePaseLibre(
                jugador,
                comp
            );


        let puntuacion = 0;


        puntuacion += avance * 0.45;

        puntuacion += espacio * 0.7;

        puntuacion += linea * 300;

        puntuacion -= d * 0.12;


        if (emergencia) {

            puntuacion +=
                espacio * 300;

        }


        /*
           Preferir jugadores que
           estén formando triángulos.
        */

        if (
            estaEnTriangulo(
                jugador,
                comp
            )
        ) {

            puntuacion += 160;

        }


        puntuacion +=
            Math.random() * 50;


        if (
            puntuacion >
            mejorPuntuacion
        ) {

            mejorPuntuacion =
                puntuacion;

            mejor = comp;

        }

    });


    return mejor;

}


/* =========================================================
   TRIANGULACIONES
========================================================= */

function buscarTriangulacion(jugador) {

    const compañeros =
        equipoDe(jugador)
            .filter(j =>
                j !== jugador &&
                j.rol !== "POR"
            );


    for (const compañero of compañeros) {

        if (
            distancia(
                jugador,
                compañero
            ) > 500
        ) {
            continue;
        }


        const tercerJugador =
            compañeros.find(otro =>
                otro !== compañero &&
                distancia(
                    compañero,
                    otro
                ) < 550 &&
                distancia(
                    jugador,
                    otro
                ) < 600
            );


        if (tercerJugador) {

            if (
                lineaDePaseLibre(
                    jugador,
                    compañero
                ) > 0.5
            ) {

                return compañero;

            }

        }

    }


    return null;

}


/* =========================================================
   DETECTAR TRIÁNGULO
========================================================= */

function estaEnTriangulo(a, b) {

    const compañeros =
        equipoDe(a)
            .filter(j =>
                j !== a &&
                j !== b
            );


    return compañeros.some(c => {

        return (
            distancia(a, c) < 600 &&
            distancia(b, c) < 600
        );

    });

}


/* =========================================================
   ESPACIO ALREDEDOR
========================================================= */

function espacioAlrededor(jugador) {

    const rivales =
        rivalDe(jugador);


    let minimo = 9999;


    rivales.forEach(r => {

        const d =
            distancia(
                jugador,
                r
            );


        minimo =
            Math.min(
                minimo,
                d
            );

    });


    return limitar(
        minimo / 250,
        0,
        2
    );

}


/* =========================================================
   LÍNEA DE PASE
========================================================= */

function lineaDePaseLibre(
    origen,
    destino
) {

    const dx =
        destino.x - origen.x;

    const dy =
        destino.y - origen.y;


    const distanciaTotal =
        Math.hypot(dx, dy);


    if (distanciaTotal === 0) {
        return 0;
    }


    let bloqueadores = 0;


    rivalDe(origen).forEach(rival => {

        const px =
            rival.x - origen.x;

        const py =
            rival.y - origen.y;


        const proyeccion =
            (
                px * dx +
                py * dy
            ) /
            (
                distanciaTotal *
                distanciaTotal
            );


        if (
            proyeccion > 0.05 &&
            proyeccion < 0.95
        ) {

            const cercaX =
                origen.x +
                dx * proyeccion;

            const cercaY =
                origen.y +
                dy * proyeccion;


            const distanciaLinea =
                Math.hypot(
                    rival.x - cercaX,
                    rival.y - cercaY
                );


            if (
                distanciaLinea < 55
            ) {

                bloqueadores++;

            }

        }

    });


    return bloquearoresToScore(
        bloqueadores
    );

}


function bloquearoresToScore(n) {

    if (n === 0) {
        return 1;
    }

    if (n === 1) {
        return 0.45;
    }

    return 0.1;

}


/* =========================================================
   CONDUCIR
========================================================= */

function conducirBalon(jugador) {

    const dir =
        direccionAtaque(jugador);


    let objetivoY =
        CENTRO_Y;


    /*
       Evitar ir siempre
       directamente a portería.
    */

    const rivales =
        rivalDe(jugador);


    const rivalCercano =
        rivales
            .sort(
                (a, b) =>
                    distancia(jugador, a) -
                    distancia(jugador, b)
            )[0];


    if (
        rivalCercano &&
        distancia(
            jugador,
            rivalCercano
        ) < 220
    ) {

        /*
           Regate lateral.
        */

        objetivoY =
            jugador.y +
            (
                jugador.y <
                rivalCercano.y
                    ? -180
                    : 180
            );

    } else {

        /*
           Conducción diagonal.
        */

        objetivoY =
            CENTRO_Y +
            Math.sin(
                Date.now() / 900 +
                jugador.x / 300
            ) * 220;

    }


    const dx =
        dir * jugador.velocidad;


    const dy =
        limitar(
            objetivoY - jugador.y,
            -3,
            3
        );


    jugador.x += dx;

    jugador.y += dy;


    jugador.x =
        limitar(
            jugador.x,
            60,
            W - 60
        );


    jugador.y =
        limitar(
            jugador.y,
            60,
            H - 60
        );

}


/* =========================================================
   ATAQUE SIN BALÓN
========================================================= */

function moverseEnAtaque(jugador) {

    const dir =
        direccionAtaque(jugador);


    const poseedor =
        balon.poseedor;


    /*
       Crear apoyos.
    */

    const distanciaBalon =
        distancia(
            jugador,
            poseedor
        );


    /*
       Jugadores cercanos
       al poseedor se ofrecen.
    */

    if (
        distanciaBalon > 220 &&
        distanciaBalon < 600
    ) {

        jugador.objetivoX =
            poseedor.x +
            dir * 100;

        jugador.objetivoY =
            poseedor.y +
            (
                jugador.baseY -
                poseedor.y
            ) * 0.45;

    } else {

        /*
           Mantener amplitud
           y estructura.
        */

        jugador.objetivoX =
            jugador.baseX +
            (
                poseedor.x -
                CENTRO_X
            ) * 0.28;

        jugador.objetivoY =
            jugador.baseY +
            (
                poseedor.y -
                jugador.baseY
            ) * 0.35;

    }


    /*
       Desmarque.
    */

    if (
        Math.random() <
        0.008
    ) {

        jugador.objetivoX +=
            dir * 250;

    }


    moverHaciaObjetivo(
        jugador,
        0.08
    );

}


/* =========================================================
   DEFENSA EN EQUIPO
========================================================= */

function defenderEnEquipo(jugador) {

    const rival =
        balon.poseedor;


    const dir =
        direccionAtaque(jugador);


    const distanciaBalon =
        distancia(
            jugador,
            rival
        );


    /*
       Jugadores cercanos presionan.
    */

    if (
        distanciaBalon < 260
    ) {

        jugador.presionando = true;

        jugador.objetivoX =
            rival.x -
            dir * 35;

        jugador.objetivoY =
            rival.y;

    } else {

        jugador.presionando = false;

        /*
           Mantener bloque defensivo.
        */

        jugador.objetivoX =
            jugador.baseX +
            (
                rival.x -
                CENTRO_X
            ) * 0.18;

        jugador.objetivoY =
            jugador.baseY +
            (
                rival.y -
                jugador.baseY
            ) * 0.22;

    }


    /*
       Cobertura:
       no todos van al balón.
    */

    const presionadores =
        equipoDe(jugador)
            .filter(j =>
                j.presionando
            );


    if (
        presionadores.length >= 2 &&
        distanciaBalon > 130
    ) {

        jugador.presionando = false;

        jugador.objetivoX =
            jugador.baseX;

        jugador.objetivoY =
            jugador.baseY;

    }


    moverHaciaObjetivo
