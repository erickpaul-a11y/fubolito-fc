<div id="info"> WASD / Flechas = mover &nbsp; | &nbsp; ESPACIO = pasar/chutar </div> <script> const canvas = document.getElementById("campo"); const ctx = canvas.getContext("2d"); const W = canvas.width; const H = canvas.height; const CENTRO_X = W / 2; const CENTRO_Y = H / 2; /* Campo aproximadamente 105 x 68 metros. Escala: 1200 / 105 ≈ 11.4 px por metro. 780 / 68 ≈ 11.47 px por metro. */ const MARGEN_X = 25; const MARGEN_Y = 25; let equipoLocal = []; let equipoRival = []; let todosLosJugadores = []; let jugadorHumano = null; let golesLocal = 0; let golesRival = 0; let teclas = {}; let partidoIniciado = false; const balon = { x: CENTRO_X, y: CENTRO_Y, vx: 0, vy: 0, radio: 8, poseedor: null, cooldown: 0 }; window.addEventListener("keydown", e => { teclas[e.key.toLowerCase()] = true; if (["arrowup","arrowdown","arrowleft","arrowright"," "] .includes(e.key.toLowerCase())) { e.preventDefault(); } }); window.addEventListener("keyup", e => { teclas[e.key.toLowerCase()] = false; }); /* ========================================================= FORMACIONES ========================================================= */ const formacion433 = [ { rol:"POR", x:55, y:390 }, { rol:"LAT", x:180, y:120 }, { rol:"DEF", x:170, y:290 }, { rol:"DEF", x:170, y:490 }, { rol:"LAT", x:180, y:660 }, { rol:"PIV", x:350, y:390 }, { rol:"MC", x:460, y:270 }, { rol:"MC", x:460, y:510 }, { rol:"EXT", x:690, y:120 }, { rol:"DEL", x:720, y:390 }, { rol:"EXT", x:690, y:660 } ]; const formacion442 = [ { rol:"POR", x:55, y:390 }, { rol:"LAT", x:180, y:120 }, { rol:"DEF", x:170, y:290 }, { rol:"DEF", x:170, y:490 }, { rol:"LAT", x:180, y:660 }, { rol:"EXT", x:420, y:120 }, { rol:"MC", x:390, y:300 }, { rol:"MC", x:390, y:480 }, { rol:"EXT", x:420, y:660 }, { rol:"DEL", x:700, y:300 }, { rol:"DEL", x:700, y:480 } ]; /* ========================================================= INICIO ========================================================= */ function iniciarJuego() { const rolElegido = document.getElementById("posicionSelect").value; document.getElementById("menu").style.display = "none"; document.getElementById("marcador").style.display = "block"; document.getElementById("info").style.display = "block"; canvas.style.display = "block"; const formacion = Math.random() < .5 ? formacion433 : formacion442; let asignado = false; equipoLocal = formacion.map((p, i) => { let humano = false; if (!asignado && p.rol === rolElegido) { humano = true; asignado = true; } const jugador = crearJugador( "L" + i, p.rol, p.x, p.y, "local", humano ); if (humano) jugadorHumano = jugador; return jugador; }); /* Si por alguna razón no existe esa posición, controla al delantero. */ if (!jugadorHumano) { const delantero = equipoLocal.find(j => j.rol === "DEL"); delantero.esHumano = true; delantero.color = "#ff3333"; jugadorHumano = delantero; } equipoRival = formacion.map((p, i) => { /* Invertimos el campo. */ const x = W - p.x; return crearJugador( "R" + i, p.rol, x, p.y, "rival", false ); }); todosLosJugadores = [...equipoLocal, ...equipoRival]; partidoIniciado = true; reiniciarPartido(); requestAnimationFrame(bucleJuego); } /* ========================================================= CREAR JUGADOR ========================================================= */ function crearJugador(id, rol, x, y, equipo, humano) { return { id, rol, x, y, baseX: x, baseY: y, equipo, esHumano: humano, radio: 14, color: humano ? "#ff3333" : equipo === "local" ? "#c71919" : "#2878e8", velocidad: humano ? 4.2 : 2.8, decision: Math.random() * 50, objetivoX: x, objetivoY: y, presionando: false, tieneBalon: false }; } /* ========================================================= UTILIDADES ========================================================= */ function limitar(v, min, max) { return Math.max(min, Math.min(max, v)); } function distancia(a,b) { return Math.hypot( a.x - b.x, a.y - b.y ); } function equipoDe(jugador) { return jugador.equipo === "local" ? equipoLocal : equipoRival; } function rivalDe(jugador) { retu .y; } moverHaciaObjetivo(jugador, .055); } /* ========================================================= MEDIAPUNTA ========================================================= */ function jugarMediapunta(jugador) { const dir = direccionAtaque(jugador); /* Busca espacios entre mediocampo y defensa. */ jugador.objetivoX = jugador.baseX + dir * 90; jugador.objetivoY = CENTRO_Y + (balon.y - CENTRO_Y) * .45; /* Si el balón está en banda, se mueve hacia el espacio. */ if ( balon.poseedor && balon.poseedor.equipo === jugador.equipo ) { if ( Math.abs(balon.y - jugador.y) > 150 ) { jugador.objetivoY = balon.y * .65 + jugador.baseY * .35; } } moverHaciaObjetivo(jugador, .055); } /* ========================================================= EXTREMOS ========================================================= */ function jugarExtremo(jugador) { const dir = direccionAtaque(jugador); /* Mantener amplitud. */ const banda = jugador.baseY < CENTRO_Y ? 115 : H - 115; /* Cuando el equipo tiene el balón, el extremo se adelanta. */ if ( balon.poseedor && balon.poseedor.equipo === jugador.equipo ) { jugador.objetivoX = jugador.baseX + dir * 170; jugador.objetivoY = banda; } else { /* Repliegue. */ jugador.objetivoX = jugador.baseX + (balon.x - CENTRO_X) * .18; jugador.objetivoY = banda + (balon.y - banda) * .15; } /* Si el balón está en su banda, se acerca para ofrecer pase. */ if ( balon.poseedor && balon.poseedor.equipo === jugador.equipo && Math.abs(balon.y - jugador.y) < 170 ) { jugador.objetivoX = balon.poseedor.x + dir * 100; } moverHaciaObjetivo(jugador, .06); } /* ========================================================= DELANTERO ========================================================= */ function jugarDelantero(jugador) { const dir = direccionAtaque(jugador); /* El delantero no persigue el balón por todo el campo. */ jugador.objetivoX = jugador.baseX + dir * 100; /* Desmarque diagonal. */ jugador.objetivoY = CENTRO_Y + Math.sin(Date.now() / 700) * 100; /* Si un compañero tiene el ba ======================================= */ function resolverColisiones() { for ( let i = 0; i < todosLosJugadores.length; i++ ) { for ( let j = i + 1; j < todosLosJugadores.length; j++ ) { const a = todosLosJugadores[i]; const b = todosLosJugadores[j]; /* Evitar que compañeros se amontonen demasiado. */ const dx = b.x - a.x; const dy = b.y - a.y; const d = Math.hypot(dx,dy); const minimo = a.radio + b.radio; if ( d < minimo && d > 0 ) { const fuerza = (minimo-d)*.35; a.x -= dx/d*fuerza; a.y -= dy/d*fuerza; b.x += dx/d*fuerza; b.y += dy/d*fuerza; } } } } /* ========================================================= REINICIAR ========================================================= */ function reiniciarPartido() { balon.x = CENTRO_X; balon.y = CENTRO_Y; balon.vx = 0; balon.vy = 0; balon.poseedor = null; balon.cooldown = 50; todosLosJugadores.forEach(j => { j.x = j.baseX; j.y = j.baseY; j.objetivoX = j.baseX; j.objetivoY = j.baseY; }); /* Dar el saque al equipo local aproximadamente después del reinicio. */ setTimeout(() => { if (!partidoIniciado) return; const saque = equipoLocal.find( j => j.rol === "DEL" ); if (saque) { balon.poseedor = saque; balon.x = saque.x; balon.y = saque.y; } }, 900); } /* ========================================================= DIBUJAR CAMPO ========================================================= */ function dibujarCampo() { /* Césped. */ ctx.fillStyle = "#278b43"; ctx.fillRect(0,0,W,H); /* Franjas de césped. */ for (let x=0; x<W; x+=80) { ctx.fillStyle = (x/80)%2 === 0 ? "rgba(255,255,255,.025)" : "rgba(0,0,0,.025)"; ctx.fillRect(x,0,80,H); } ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 3; /* Línea exterior. */ ctx.strokeRect( MARGEN_X, MARGEN_Y, W-MARGEN_X*2, H-MARGEN_Y*2 ); /* Medio campo. */ ctx.beginPath(); ctx.moveTo( CENTRO_X, MARGEN_Y ); ctx.lineTo( CENTRO_X, H-MARGEN_Y ); ctx.stroke(); /* Círculo central. */ ctx.beginPath(); ctx.arc( CENTRO_X, CENTRO_Y, 95, 0, Math.PI*2 ); ctx.stroke(); /* Punto central. */ ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc( CENTRO_X, CENTRO_Y, 5, 0, Math.PI*2 ); ctx.fill(); /* Áreas. */ const areaW = 185; const areaH = 390; ctx.strokeRect( MARGEN_X, CENTRO_Y-areaH/2, areaW, areaH ); ctx.strokeRect( W-MARGEN_X-areaW, CENTRO_Y-areaH/2, areaW, areaH ); /* Áreas pequeñas. */ const pequenaW = 70; const pequenaH = 210; ctx.strokeRect( MARGEN_X, CENTRO_Y-pequenaH/2, pequenaW, pequenaH ); ctx.strokeRect( W-MARGEN_X-pequenaW, CENTRO_Y-pequenaH/2, pequenaW, pequenaH ); /* Porterías. */ ctx.strokeRect( 0, CENTRO_Y-105, 25, 210 ); ctx.strokeRect( W-25, CENTRO_Y-105, 25, 210 ); /* Redes. */ ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect( 0, CENTRO_Y-105, 25, 210 ); ctx.fillRect( W-25, CENTRO_Y-105, 25, 210 ); /* Esquinas. */ ctx.beginPath(); ctx.arc( MARGEN_X, MARGEN_Y, 18, 0, Math.PI/2 ); ctx.stroke(); ctx.beginPath(); ctx.arc( W-MARGEN_X, MARGEN_Y, 18, Math.PI/2, Math.PI ); ctx.stroke(); ctx.beginPath(); ctx.arc( MARGEN_X, H-MARGEN_Y, 18, -Math.PI/2, 0 ); ctx.stroke(); ctx.beginPath(); ctx.arc( W-MARGEN_X, H-MARGEN_Y, 18, Math.PI, Math.PI*1.5 ); ctx.stroke(); } /* ========================================================= DIBUJAR JUGADORES ========================================================= */ function dibujarJugadores() { todosLosJugadores.forEach(j => { /* Sombra. */ ctx.beginPath(); ctx.ellipse( j.x, j.y+11, j.radio, 5, 0, 0, Math.PI*2 ); ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fill(); /* Jugador. */ ctx.beginPath(); ctx.arc( j.x, j.y, j.radio, 0, Math.PI*2 ); ctx.fillStyle = j.color; ctx.fill(); ctx.strokeStyle = j.esHumano ? "#ffe600" : "white"; ctx.lineWidth = j.esHumano ? 3 : 1.5; ctx.stroke(); /* Indicador del jugador humano. */ if (j.esHumano) { ctx.beginPath(); ctx.arc( j.x, j.y, j.radio+6, 0, Math.PI*2 ); ctx.strokeStyle = "#ffff00"; ctx.lineWidth = 2; ctx.stroke(); } /* Rol. */ ctx.fillStyle = "white"; ctx.font = "bold 11px Arial"; ctx.textAlign = "center"; ctx.fillText( j.rol, j.x, j.y-20 ); }); } /* ========================================================= DIBUJAR BALÓN ========================================================= */ function dibujarBalon() { ctx.beginPath(); ctx.arc( balon.x, balon.y, balon.radio, 0, Math.PI*2 ); ctx.fillStyle = "white"; ctx.fill(); ctx.strokeStyle = "black"; ctx.lineWidth = 1.5; ctx.stroke(); /* Pequeño patrón. */ ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc( balon.x, balon.y, 2.5, 0, Math.PI*2 ); ctx.fill(); } /* ========================================================= ACTUALIZACIÓN ========================================================= */ function actualizar() { if (!partidoIniciado) return; actualizarHumano(); todosLosJugadores.forEach( actualizarIA ); resolverColisiones(); actualizarBalon(); } /* ========================================================= RENDER ========================================================= */ function renderizar() { ctx.clearRect( 0, 0, W, H ); dibujarCampo(); dibujarJugadores(); dibujarBalon(); } /* ========================================================= BUCLE ========================================================= */ function bucleJuego() { actualizar(); renderizar(); requestAnimationFrame( bucleJuego ); } </script> </body> </html>
